
name: Test Animation Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Render sample animation
        run: npx remotion render src/index.ts Rewind out/test.mp4 --codec=h264 --concurrency=2

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: animation-test
          path: studio/out/test.mp4
          if-no-files-found: error
  
