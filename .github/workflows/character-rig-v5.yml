name: Rig V5 — Skill-Guided Physical Acting Proof

on:
  push:
    branches: [feature/character-rig-v5-skill-guided-mechanics]
    paths:
      - 'studio/src/episodes/probability-control/character-rig-v5.tsx'
      - 'studio/src/episodes/probability-control/character-acting-v5.tsx'
      - 'studio/src/Root.tsx'
      - 'production/style/CHARACTER_RIG_V5_SKILL_GUIDANCE.md'
      - '.github/workflows/character-rig-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install pinned project dependencies
        run: npm ci
      - name: Typecheck all previous and new compositions
        run: npx tsc --noEmit
      - name: Render five animation beats for visual rejection testing
        run: |
          mkdir -p out/character-v5
          npx remotion still src/index.ts CharacterActingV5 out/character-v5/01-stance.png --frame=42 --scale=0.6666666666666666
          npx remotion still src/index.ts CharacterActingV5 out/character-v5/02-stride.png --frame=87 --scale=0.6666666666666666
          npx remotion still src/index.ts CharacterActingV5 out/character-v5/03-squat.png --frame=200 --scale=0.6666666666666666
          npx remotion still src/index.ts CharacterActingV5 out/character-v5/04-button-contact.png --frame=233 --scale=0.6666666666666666
          npx remotion still src/index.ts CharacterActingV5 out/character-v5/05-reaction.png --frame=289 --scale=0.6666666666666666
      - name: Render 11-second original acting motion test
        run: |
          npx remotion render src/index.ts CharacterActingV5 \
            out/character-v5/Character-Rig-V5-11s.mp4 \
            --codec=h264 --scale=0.6666666666666666 \
            --concurrency=2 --crf=21 --muted
      - name: Install FFmpeg tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify 330 frames and export review sheet
        run: |
          set -euo pipefail
          f=out/character-v5/Character-Rig-V5-11s.mp4
          count=$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$f")
          test "$count" = 330
          ffmpeg -y -hide_banner -loglevel error -i "$f" \
            -vf 'fps=1,scale=480:270,tile=4x3:padding=8:margin=8:color=0x101725' \
            -frames:v 1 -update 1 out/character-v5/V5-11-Moments.jpg
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$f"
      - name: Upload video and stills for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHARACTER-RIG-V5-ACTING-PROOF
          path: studio/out/character-v5/*
          retention-days: 14
          if-no-files-found: warn
