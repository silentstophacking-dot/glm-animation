name: Production render
on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Exact composition ID (see studio/src/Root.tsx and episodes)'
        required: true
        default: ClockDiscoveryPerformance
        type: string
  push:
    branches: ['production/**', 'feature/ifverse-contact-preview', 'feature/balanced-motion-proof', 'feature/pseudo-depth-proof', 'feature/character-performance-v3', 'feature/character-turn-v5', 'feature/character-sunset-lighting', 'feature/combined-character-performance', 'feature/lab-room-depth', 'feature/puffer-lab-performance', 'feature/lab-time-anomaly', 'feature/cinematic-clock-insert', 'feature/clock-discovery-acting']
    paths: ['studio/**', 'scripts/render-production.mjs', 'scripts/verify-render.py', 'scripts/verify-anomaly-audio.py', '.github/workflows/production-render.yml']
permissions:
  contents: read
concurrency:
  group: production-render-${{ github.ref }}-${{ inputs.composition || 'IfverseContactPreview' }}
  cancel-in-progress: ${{ github.ref_name == 'feature/clock-discovery-acting' && github.event_name == 'push' }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COMPOSITION: ${{ inputs.composition || (github.ref_name == 'feature/clock-discovery-acting' && 'ClockDiscoveryPerformance' || github.ref_name == 'feature/cinematic-clock-insert' && 'ClockInsertV2Proof' || github.ref_name == 'feature/lab-time-anomaly' && 'LabTimeAnomaly' || github.ref_name == 'feature/puffer-lab-performance' && 'PufferRoomPerformance' || github.ref_name == 'feature/lab-room-depth' && 'LabRoomDepthProof' || github.ref_name == 'feature/combined-character-performance' && 'CombinedCharacterPerformance' || github.ref_name == 'feature/character-sunset-lighting' && 'CharacterSunsetLightingProof' || github.ref_name == 'feature/character-turn-v5' && 'CharacterTurnV5Proof' || github.ref_name == 'feature/character-performance-v3' && 'PerformanceV3Proof' || github.ref_name == 'feature/pseudo-depth-proof' && 'DepthCameraProof' || github.ref_name == 'feature/balanced-motion-proof' && 'BalancedMotionProof' || 'IfverseContactPreview') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: mkdir -p studio/out/production
      - name: Install locked dependencies
        working-directory: studio
        run: |
          set -o pipefail
          npm ci 2>&1 | tee out/production/install.log
      - name: Typecheck
        working-directory: studio
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee out/production/typecheck.log
      - name: Audit balanced motion contacts
        if: env.COMPOSITION == 'BalancedMotionProof'
        working-directory: studio
        run: |
          npx --no-install esbuild src/episodes/probability-control/slender-mechanics.ts --bundle --platform=node --outfile=out/production/audit.cjs
          node -e "console.log(require('./out/production/audit.cjs').auditBalanced())"
      - name: Audit projection and character contacts
        if: env.COMPOSITION == 'DepthCameraProof'
        working-directory: studio
        run: |
          npx --no-install esbuild src/episodes/probability-control/pseudo-depth-audit.ts --bundle --platform=node --outfile=out/production/depth-audit.cjs
          node -e "console.log(require('./out/production/depth-audit.cjs').auditDepthCharacter())" | tee out/production/depth-audit.log
      - name: Audit performance support and rendered rig
        if: env.COMPOSITION == 'PerformanceV3Proof'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/performance-v3-audit.ts --bundle --platform=node --outfile=out/production/performance-audit.cjs
          node -e "console.log(require('./out/production/performance-audit.cjs').auditPerformanceRig())" | tee out/production/performance-audit.log
      - name: Audit character turn geometry
        if: env.COMPOSITION == 'CharacterTurnV5Proof' || env.COMPOSITION == 'CharacterSunsetLightingProof'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/character-turn-v5.tsx --bundle --platform=node --outfile=out/production/turn-audit.cjs
          node -e "console.log(require('./out/production/turn-audit.cjs').auditTurnV5(process.env.COMPOSITION === 'CharacterSunsetLightingProof' ? 'sunset' : 'baseline'))" | tee out/production/turn-audit.log
      - name: Audit combined character support and contact
        if: env.COMPOSITION == 'CombinedCharacterPerformance'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/combined-performance-motion.ts --bundle --platform=node --outfile=out/production/combined-audit.cjs
          node -e "console.log(require('./out/production/combined-audit.cjs').auditCombinedPerformance())" | tee out/production/combined-audit.log
      - name: Audit shared room projection and support anchors
        if: env.COMPOSITION == 'LabRoomDepthProof'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/lab-room-geometry.tsx --bundle --platform=node --outfile=out/production/room-audit.cjs
          node -e "console.log(require('./out/production/room-audit.cjs').auditLabRoom())" | tee out/production/room-audit.log
      - name: Audit puffer sleeves and world-space interaction
        if: env.COMPOSITION == 'PufferRoomPerformance'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/puffer-room-performance-motion.ts --bundle --platform=node --outfile=out/production/puffer-audit.cjs
          node -e "console.log(require('./out/production/puffer-audit.cjs').auditPufferRoomPerformance())" | tee out/production/puffer-audit.log
      - name: Audit mini-scene contacts, clock direction and sound cues
        if: env.COMPOSITION == 'LabTimeAnomaly' || env.COMPOSITION == 'LabTimeAnomalyV2'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/lab-time-anomaly-motion.ts --bundle --platform=node --outfile=out/production/anomaly-audit.cjs
          node -e "console.log(JSON.stringify(require('./out/production/anomaly-audit.cjs').auditLabTimeAnomaly(),null,2))" | tee out/production/anomaly-audit.json
      - name: Audit clock case depth and insert camera
        if: env.COMPOSITION == 'ClockInsertV2Proof' || env.COMPOSITION == 'LabTimeAnomalyV2' || env.COMPOSITION == 'ClockDiscoveryPerformance'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/cinematic-lab-clock.tsx --bundle --platform=node --outfile=out/production/clock-audit.cjs
          node -e "console.log(require('./out/production/clock-audit.cjs').auditCinematicClock())" | tee out/production/clock-audit.log
      - name: Audit discovery acting and preserved contacts
        if: env.COMPOSITION == 'ClockDiscoveryPerformance'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/clock-discovery-motion.ts --bundle --platform=node --outfile=out/production/discovery-audit.cjs
          node -e "console.log(JSON.stringify(require('./out/production/discovery-audit.cjs').auditClockDiscovery(),null,2))" | tee out/production/anomaly-audit.json
      - name: Audit autonomous press with fixed world-space support
        if: env.COMPOSITION == 'UntouchedPressProof'
        working-directory: studio
        run: |
          set -o pipefail
          npx --no-install esbuild src/episodes/probability-control/untouched-press-proof.tsx --bundle --platform=node --outfile=out/production/untouched-audit.cjs
          node -e "console.log(JSON.stringify(require('./out/production/untouched-audit.cjs').auditUntouchedPress(),null,2))" | tee out/production/untouched-audit.log
      - name: Install verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render selected composition in full
        working-directory: studio
        run: |
          set -o pipefail
          node ../scripts/render-production.mjs 2>&1 | tee out/production/render.log
      - name: Render character view and depth-contact boards
        if: env.COMPOSITION == 'DepthCameraProof'
        working-directory: studio
        run: |
          npx remotion still src/pseudo-depth-entry.tsx DepthCharacterStudy out/production/Character-Depth-Views.png --frame=0
          npx remotion still src/pseudo-depth-entry.tsx DepthContactBoard out/production/Depth-Contact-Board.png --frame=0
      - name: Render performance key poses
        if: env.COMPOSITION == 'PerformanceV3Proof'
        working-directory: studio
        run: npx remotion still src/performance-v3-entry.tsx PerformanceV3Board out/production/Performance-Key-Poses.png --frame=0
      - name: Render turn key views
        if: env.COMPOSITION == 'CharacterTurnV5Proof'
        working-directory: studio
        run: npx remotion still src/character-turn-v5-entry.tsx CharacterTurnV5Board out/production/Character-Turn-V5-Views.png --frame=0
      - name: Render sunset lighting comparison
        if: env.COMPOSITION == 'CharacterSunsetLightingProof'
        working-directory: studio
        run: npx remotion still src/character-lighting-entry.tsx CharacterSunsetLightingBoard out/production/Sunset-Lighting-Comparison.png --frame=0
      - name: Render combined performance key poses
        if: env.COMPOSITION == 'CombinedCharacterPerformance'
        working-directory: studio
        run: npx remotion still src/combined-performance-entry.tsx CombinedCharacterBoard out/production/Combined-Character-Poses.png --frame=0
      - name: Render lab room key views
        if: env.COMPOSITION == 'LabRoomDepthProof'
        working-directory: studio
        run: npx remotion still src/lab-room-depth-entry.tsx LabRoomDepthBoard out/production/Lab-Room-Depth-Views.png --frame=0
      - name: Render puffer performance key poses
        if: env.COMPOSITION == 'PufferRoomPerformance'
        working-directory: studio
        run: npx remotion still src/puffer-room-performance-entry.tsx PufferRoomPerformanceBoard out/production/Puffer-Room-Performance-Poses.png --frame=0
      - name: Render mini-scene storyboard
        if: env.COMPOSITION == 'LabTimeAnomaly'
        working-directory: studio
        run: npx remotion still src/lab-time-anomaly-entry.tsx LabTimeAnomalyBoard out/production/Lab-Time-Anomaly-Storyboard.png --frame=0
      - name: Render cinematic clock review
        if: env.COMPOSITION == 'ClockInsertV2Proof' || env.COMPOSITION == 'LabTimeAnomalyV2' || env.COMPOSITION == 'ClockDiscoveryPerformance'
        working-directory: studio
        run: |
          npx remotion still src/cinematic-clock-entry.tsx ClockInsertV2Board out/production/Clock-Insert-Comparison.png --frame=0
          npx remotion still src/cinematic-clock-entry.tsx CinematicClockStill out/production/Cinematic-Clock.png --frame=0
      - name: Render discovery acting board
        if: env.COMPOSITION == 'ClockDiscoveryPerformance'
        working-directory: studio
        run: npx remotion still src/clock-discovery-entry.tsx ClockDiscoveryBoard out/production/Discovery-Acting-Board.png --frame=0
      - name: Render six-frame untouched press storyboard
        if: env.COMPOSITION == 'UntouchedPressProof'
        working-directory: studio
        run: npx remotion still src/untouched-press-entry.tsx UntouchedPressBoard out/production/Untouched-Press-Storyboard.png --frame=0
      - name: Verify decoded MP4 and mobile metadata
        run: python3 scripts/verify-render.py studio/out/production
      - name: Verify mini-scene audio track and cue timing
        if: env.COMPOSITION == 'LabTimeAnomaly' || env.COMPOSITION == 'LabTimeAnomalyV2'
        run: python3 scripts/verify-anomaly-audio.py studio/out/production
      - name: Verify clock review audio
        if: env.COMPOSITION == 'ClockInsertV2Proof'
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, subprocess
          p=next(pathlib.Path('studio/out/production').glob('*.mp4'))
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',str(p)]))
          a=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert a['codec_name']=='aac' and int(a['channels'])==2 and abs(float(a['duration'])-3)<.1
          print('Verified three-second AAC stereo review track')
          PYTHON
      - name: Verify retimed discovery audio
        if: env.COMPOSITION == 'ClockDiscoveryPerformance'
        run: python3 scripts/verify-anomaly-audio.py studio/out/production studio/public/lab-discovery-v3/soundtrack.json
      - name: Upload verified movie
        uses: actions/upload-artifact@v4
        with:
          name: MP4-${{ env.COMPOSITION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: studio/out/production/*.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REVIEW-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            studio/out/production/*.log
            studio/out/production/*.json
            studio/out/production/*.png
          if-no-files-found: warn
          retention-days: 14
