name: Probability Original Foley (AUDIO ONLY)

on:
  push:
    branches: [feature/probability-longform-quality-fixes]
    paths:
      - 'scripts/generate_probability_sfx.py'
      - '.github/workflows/probability-foley-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize-original-sfx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Foley source branch
        uses: actions/checkout@v4
        with:
          ref: feature/probability-longform-quality-fixes
          persist-credentials: true

      - name: Python and audio dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy and FFmpeg (NO video rendering)
        run: |
          python -m pip install "numpy>=1.26,<3"
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Generate 230-second original Foley and safety-check audio
        run: |
          python scripts/generate_probability_sfx.py \
            --map production/probability-longform/EDITING_MAP.json \
            --output out/probability-sfx
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('out/probability-sfx/Probability_Original_Foley_230s.mp3')
          r=json.loads(Path('out/probability-sfx/sfx-cue-report.json').read_text())
          duration=float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration',
              '-of','default=noprint_wrappers=1:nokey=1',str(p)
          ]).decode())
          assert 229.8 <= duration <= 230.5, duration
          assert r['event_count'] >= 45, r['event_count']
          assert 0 < r['peak'] <= .23, r['peak']
          assert r['silence_from_sec'] == 221.
          assert p.stat().st_size > 1000000
          assert not list(Path('out/probability-sfx').rglob('*.mp4'))
          print('Original Foley validated:',duration,'sec;',r['event_count'],'cues')
          PY

      - name: Stage only original sound effects in existing Remotion public dir
        run: |
          mkdir -p studio/public/probability-longform
          cp out/probability-sfx/Probability_Original_Foley_230s.mp3 \
            studio/public/probability-longform/sfx.mp3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/public/probability-longform/sfx.mp3
          if git diff --cached --quiet; then
            echo "Foley file already staged."
          else
            git commit -m "assets(audio): stage original scene-synchronized Foley for probability longform"
            # The project is being edited from ChatGPT while GitHub renders
            # audio. Fetch/rebase before pushing; never overwrite source work.
            # If the generator itself changed after this job started, abort
            # instead of committing stale audio.
            git fetch origin feature/probability-longform-quality-fixes
            latest_script=$(git show FETCH_HEAD:scripts/generate_probability_sfx.py | sha256sum | cut -d' ' -f1)
            local_script=$(sha256sum scripts/generate_probability_sfx.py | cut -d' ' -f1)
            if [ "$latest_script" != "$local_script" ]; then
              echo "::error::Generator source changed mid-job; rerun with latest sound cues."
              exit 1
            fi
            git rebase FETCH_HEAD
            git push origin HEAD:feature/probability-longform-quality-fixes
          fi

      - name: Upload MP3 only (no ZIP of images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LISTEN-PROBABILITY-ORIGINAL-FOLEY-MP3-ONLY
          path: out/probability-sfx/Probability_Original_Foley_230s.mp3
          if-no-files-found: warn
          retention-days: 14

      - name: Upload sound cue manifest (non-video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FOLEY-CUE-TIMES
          path: out/probability-sfx/sfx-cue-report.json
          if-no-files-found: warn
          retention-days: 14
