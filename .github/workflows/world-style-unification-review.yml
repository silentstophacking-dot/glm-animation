name: World Style Unification — three checkpoint stills

on:
  push:
    branches: ['feature/environment-city-style-unification']
    paths:
      - 'studio/src/episodes/probability-control/lab-rich-world.tsx'
      - 'studio/src/episodes/probability-control/lab-room-depth.tsx'
      - 'studio/src/episodes/probability-control/reversal-evidence-storyboard.tsx'
      - '.github/workflows/world-style-unification-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-style-unification-stills
  cancel-in-progress: true

jobs:
  art-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install existing pinned Remotion dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck entire existing project and revised world
        run: npm run typecheck
      - name: Source audit of original scene and grounded character
        run: |
          set -euo pipefail
          mkdir -p out/world-style
          npx --no-install esbuild src/episodes/probability-control/reversal-evidence-storyboard.tsx --bundle --platform=node --outfile=out/world-style/audit.cjs
          node -e "console.log(JSON.stringify(require('./out/world-style/audit.cjs').auditReversalEvidence(),null,2))" | tee out/world-style/audit.log
      - name: Render opening wide — skyline, props and material quality
        run: |
          npx remotion still src/reversal-evidence-entry.tsx ReversalEvidenceFrame \
            out/world-style/01-Opening-Wide.png --frame=33 --scale=0.6666666666666666
      - name: Render glass reversal — equipment and bench detail
        run: |
          npx remotion still src/reversal-evidence-entry.tsx ReversalEvidenceFrame \
            out/world-style/02-Glass-Bench.png --frame=254 --scale=0.6666666666666666
      - name: Render reaction — world/character quality parity
        run: |
          npx remotion still src/reversal-evidence-entry.tsx ReversalEvidenceFrame \
            out/world-style/03-Character-Reaction.png --frame=416 --scale=0.6666666666666666
      - name: Build three-frame iPhone review contact sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          folder=Path('out/world-style')
          images=[Image.open(folder/n).convert('RGB') for n in (
           '01-Opening-Wide.png','02-Glass-Bench.png','03-Character-Reaction.png')]
          out=Image.new('RGB',(1280,720*3+150),'#151b2b')
          d=ImageDraw.Draw(out)
          for i,(img,label) in enumerate(zip(images,(
              '01 - OPENING / SKYLINE','02 - GLASS / WORKBENCH',
              '03 - ACTOR / ENVIRONMENT'))):
            y=i*770
            d.text((18,y+12),label,fill='#efdec7')
            out.paste(img,(0,y+45))
          out.save(folder/'00-Three-Checkpoint-Review.jpg',quality=90)
          PY
      - name: Upload all still images without rendering a movie
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-STYLE-THREE-CHECKPOINTS
          path: |
            studio/out/world-style/*.png
            studio/out/world-style/*.jpg
            studio/out/world-style/*.log
          retention-days: 30
          if-no-files-found: error
