name: Stage Loudness-Balanced Probability Master (AUDIO ONLY)

on:
  push:
    branches: [feature/probability-longform-quality-fixes]
    paths: ['.github/workflows/stage-probability-master-audio.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  master-audio-only:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/probability-longform-quality-fixes
          persist-credentials: true
      - name: Install FFmpeg only, NO VIDEO RENDER
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Create original 230-second loudness-balanced soundtrack
        run: |
          mkdir -p out/probability-final-audio
          ffmpeg -hide_banner -loglevel error -y \
            -i studio/public/probability-longform/voice.mp3 \
            -i studio/public/probability-longform/sfx.mp3 \
            -i studio/public/probability-longform/music.mp3 \
            -filter_complex '[0:a]volume=0.82[v];[1:a]volume=0.55[fx];[2:a]volume=0.26[mu];[v][fx][mu]amix=inputs=3:duration=first:dropout_transition=0,loudnorm=I=-15:TP=-1.6:LRA=11[master]' \
            -map '[master]' -c:a libmp3lame -b:a 160k \
            out/probability-final-audio/Probability_Loudness_Balanced_Master.mp3
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          p=Path('out/probability-final-audio/Probability_Loudness_Balanced_Master.mp3')
          dur=float(subprocess.check_output([
            'ffprobe','-v','error','-show_entries','format=duration',
            '-of','default=noprint_wrappers=1:nokey=1',str(p)
          ]))
          assert 229.7<dur<230.5,dur
          assert p.stat().st_size>1000000
          print('Balanced master duration',dur,'seconds')
          PY
          cp out/probability-final-audio/Probability_Loudness_Balanced_Master.mp3 \
            studio/public/probability-longform/master.mp3
      - name: Store soundtrack without overriding concurrent source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/public/probability-longform/master.mp3
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): stage phone-friendly loudness-balanced Probability full mix"
            git fetch origin feature/probability-longform-quality-fixes
            git rebase FETCH_HEAD
            git push origin HEAD:feature/probability-longform-quality-fixes
          fi
      - name: Deliver full mastered soundtrack, audio only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LISTEN-PROBABILITY-LOUDNESS-BALANCED-FULL-AUDIO
          path: out/probability-final-audio/Probability_Loudness_Balanced_Master.mp3
          if-no-files-found: warn
          retention-days: 14
